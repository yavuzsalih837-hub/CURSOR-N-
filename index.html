<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgentOS - Neural Grid</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#050816;
      color:white;
      height:100vh;
      overflow:hidden;
    }

    .container{
      display:flex;
      width:100%;
      height:100vh;
    }

    .sidebar{
      width:240px;
      background:#08111f;
      border-right:1px solid #0f2a44;
      padding:20px;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
      margin-bottom:40px;
      color:#00c3ff;
    }

    .menu-item{
      padding:14px;
      border:1px solid #12314f;
      border-radius:10px;
      margin-bottom:12px;
      cursor:pointer;
      transition:0.2s;
    }

    .menu-item:hover{
      background:#0f1d30;
    }

    .main{
      flex:1;
      padding:30px;
    }

    .title{
      font-size:42px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .subtitle{
      color:#8aa4c2;
      margin-bottom:30px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .card{
      border:1px solid #12314f;
      border-radius:16px;
      padding:20px;
      background:#08111f;
    }

    .card-title{
      font-size:22px;
      margin-bottom:20px;
      color:#00c3ff;
    }

    textarea{
      width:100%;
      height:180px;
      background:#050816;
      border:1px solid #12314f;
      border-radius:12px;
      padding:15px;
      color:white;
      resize:none;
      font-size:16px;
      margin-bottom:20px;
    }

    button{
      background:#00c3ff;
      border:none;
      color:black;
      padding:14px 22px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      font-size:15px;
      transition:0.2s;
    }

    button:hover{
      transform:scale(1.03);
    }

    #telemetry{
      margin-top:20px;
      background:#050816;
      border:1px solid #12314f;
      border-radius:12px;
      padding:15px;
      min-height:200px;
      overflow:auto;
    }

    .log{
      margin-bottom:12px;
      padding:10px;
      background:#0d1726;
      border-radius:8px;
    }

    .success{
      color:lime;
    }

    .error{
      color:red;
    }

    .memory-box{
      min-height:300px;
      background:#050816;
      border:1px solid #12314f;
      border-radius:12px;
      padding:15px;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="sidebar">

    <div class="logo">
      NEURAL GRID
    </div>

    <div class="menu-item">
      Command Center
    </div>

    <div class="menu-item">
      Agent Mesh
    </div>

    <div class="menu-item">
      Memory System
    </div>

    <div class="menu-item">
      Telemetry
    </div>

  </div>

  <div class="main">

    <div class="title">
      COMMAND CENTER
    </div>

    <div class="subtitle">
      Jarvis Multi-Agent Operating System
    </div>

    <div class="grid">

      <div class="card">

        <div class="card-title">
          Mission Control
        </div>

        <textarea
          id="objective"
          placeholder="Görev yaz..."
        ></textarea>

        <button id="deploy-btn">
          Deploy Mission
        </button>

        <div id="telemetry"></div>

      </div>

      <div class="card">

        <div class="card-title">
          Collective Memory
        </div>

        <div class="memory-box" id="memory-box">

        </div>

      </div>

    </div>

  </div>

</div>

<script src="./js/app.js"></script>

</body>
</html>
