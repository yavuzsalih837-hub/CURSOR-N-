<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgentOS - Neural Grid</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#050816;
      color:white;
      height:100vh;
      overflow:auto;
    }

    .container{
      display:flex;
      width:100%;
      height:100vh;
    }

    .sidebar{
      width:240px;
      background:#08111f;
      border-right:1px solid #0f2a44;
      padding:20px;
    }

    .logo{
      font-size:24px;
      font-weight:bold;
      margin-bottom:40px;
      color:#00c3ff;
    }

    .menu-item{
      padding:14px;
      border:1px solid #12314f;
      border-radius:10px;
      margin-bottom:12px;
      cursor:pointer;
      transition:0.2s;
    }

    .menu-item:hover{
      background:#0f1d30;
    }

    .main{
      flex:1;
      padding:30px;
    }

    .title{
      font-size:42px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .subtitle{
      color:#8aa4c2;
      margin-bottom:30px;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .card{
      border:1px solid #12314f;
      border-radius:16px;
      padding:20px;
      background:#08111f;
    }

    .card-title{
      font-size:22px;
      margin-bottom:20px;
      color:#00c3ff;
    }

    textarea{
      width:100%;
      height:180px;
      background:#050816;
      border:1px solid #12314f;
      border-radius:12px;
      padding:15px;
      color:white;
      resize:none;
      font-size:16px;
      margin-bottom:20px;
    }

    button{
      background:#00c3ff;
      border:none;
      color:black;
      padding:14px 22px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      font-size:15px;
      transition:0.2s;
    }

    button:hover{
      transform:scale(1.03);
    }

    #telemetry{
      margin-top:20px;
      background:#050816;
      border:1px solid #12314f;
      border-radius:12px;
      padding:15px;
      min-height:200px;
      overflow:auto;
    }

    .log{
      margin-bottom:12px;
      padding:10px;
      background:#0d1726;
      border-radius:8px;
    }

    .success{
      color:lime;
    }

    .error{
      color:red;
    }

    .memory-box{
      min-height:300px;
      background:#050816;
      border:1px solid #12314f;
      border-radius:12px;
      padding:15px;
    }

    #task-queue{
      margin-top:20px;
      background:#050816;
      border:1px solid #12314f;
      border-radius:12px;
      padding:15px;
      min-height:200px;
      overflow:auto;
    }

    .task-row{
      margin-bottom:12px;
      padding:12px;
      border:1px solid #12314f;
      border-radius:10px;
      background:#0d1726;
    }

    .task-row:last-child{
      margin-bottom:0;
    }

    .task-top{
      display:flex;
      flex-wrap:wrap;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .task-id{
      color:#d7e7ff;
      font-weight:bold;
      font-size:13px;
      word-break:break-word;
    }

    .task-status{
      font-weight:bold;
      font-size:13px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid #12314f;
      background:#08111f;
    }

    .status-QUEUED{ color:#facc15; border-color:rgba(250,204,21,0.45); }
    .status-RUNNING{ color:#00c3ff; border-color:rgba(0,195,255,0.45); }
    .status-DONE{ color:#22c55e; border-color:rgba(34,197,94,0.45); }
    .status-FALLBACK_DONE{ color:#f97316; border-color:rgba(249,115,22,0.55); }

    .task-meta{
      color:#8aa4c2;
      font-size:13px;
      line-height:1.45;
    }

    #agent-mesh{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
      gap:12px;
    }

    .agent-card{
      border:1px solid #12314f;
      border-radius:12px;
      padding:14px;
      background:#0d1726;
    }

    .agent-name{
      color:#00c3ff;
      font-weight:bold;
      font-size:15px;
      margin-bottom:10px;
    }

    .agent-status{
      display:inline-block;
      font-size:12px;
      font-weight:bold;
      padding:5px 10px;
      border-radius:999px;
      border:1px solid #12314f;
      margin-bottom:10px;
    }

    .agent-status-IDLE{ color:#94a3b8; border-color:rgba(148,163,184,0.45); }
    .agent-status-RUNNING{ color:#00c3ff; border-color:rgba(0,195,255,0.45); }
    .agent-status-DONE{ color:#22c55e; border-color:rgba(34,197,94,0.45); }

    .agent-meta{
      color:#8aa4c2;
      font-size:12px;
      line-height:1.45;
      margin-bottom:6px;
      word-break:break-word;
    }

  </style>
</head>

<body>

<div class="container">

  <div class="sidebar">

    <div class="logo">
      NEURAL GRID
    </div>

    <div class="menu-item">
      Command Center
    </div>

    <div class="menu-item">
      Agent Mesh
    </div>

    <div class="menu-item">
      Memory System
    </div>

    <div class="menu-item">
      Telemetry
    </div>

  </div>

  <div class="main">

    <div class="title">
      COMMAND CENTER
    </div>

    <div class="subtitle">
      Jarvis Core v0.4 · Agent Mesh Live Status
    </div>

    <div class="grid">

      <div class="card">

        <div class="card-title">
          Mission Control
        </div>

        <textarea
          id="objective"
          placeholder="Görev yaz..."
        ></textarea>

        <button id="deploy-btn">
          Deploy Mission
        </button>

        <div id="telemetry"></div>

      </div>

      <div class="card">

        <div class="card-title">
          Collective Memory
        </div>

        <div class="memory-box" id="memory-box">

        </div>

      </div>

      <div class="card">
        <div class="card-title">TASK QUEUE</div>
        <div id="task-queue">Loading tasks...</div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <div class="card-title">AGENT MESH</div>
        <div id="agent-mesh">Loading agents...</div>
      </div>

    </div>

  </div>

</div>

<script src="./js/app.js"></script>

</body>
</html>
